name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Canvas layout tests use real Chinese glyph metrics, never missing-glyph boxes.
      - name: Install CJK font fallback
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-core
          fc-match sans-serif:lang=zh-cn
      - run: npm ci
      - run: node -e "require('canvas').createCanvas(1,1)"
      - run: npm run check
      - run: git diff --exit-code -- index.js client.js THIRD_PARTY_NOTICES.md
      - run: npm pack --dry-run
